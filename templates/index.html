<!DOCTYPE html>
<html>
<head>
    <title>AI-Based Cyberattack Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1f2937;
        }

        p {
            color: #555;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI-Based Cyberattack Detection System</h1>

    <p>Enter a network-flow row number to detect whether it is benign or an attack.</p>

    <form action="/predict" method="POST">

        <input
            type="number"
            name="row_number"
            min="0"
            max="2455364"
            placeholder="Enter row number"
            required
        >

        <br>

        <button type="submit">
            Detect Attack
        </button>

    </form>

    {% if prediction %}

    <div class="result">
        Prediction: {{ prediction }}
    </div>

    <p>Network Flow Row: {{ row_number }}</p>

    {% endif %}

</div>

</body>
</html>
